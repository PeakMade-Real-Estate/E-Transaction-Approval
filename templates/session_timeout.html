<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired — E-Transaction Approval Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">
    <main class="card shadow-sm border-0" style="max-width: 32rem;">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="fas fa-clock-rotate-left text-warning fs-1 mb-3"></i>
            <h1 class="h3 fw-bold">Session expired</h1>
            <p class="text-muted mb-4">
                Your E-Transaction Approval session expired after
                {{ idle_timeout_minutes }} minutes of inactivity. Sign in again to continue.
            </p>
            <a class="btn btn-primary" href="/.auth/login/aad?post_login_redirect_uri=%2F">
                <i class="fas fa-right-to-bracket me-1"></i>Sign in again
            </a>
        </div>
    </main>
</body>
</html>
